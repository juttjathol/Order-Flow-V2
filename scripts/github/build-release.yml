name: Build Release APK + Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install a valid Gradle wrapper
        run: bash scripts/ensure_gradle_wrapper.sh

      - name: Force compileSdk 36 and minSdk 23
        run: python3 scripts/patch_android.py

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Patch Android plugin namespaces
        run: python3 scripts/patch_android.py --plugins

      - name: Build release APK
        working-directory: flutter_app
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build-apk.log

      - name: Surface build errors (diagnostics)
        if: failure()
        shell: bash
        run: |
          { grep -E '(^|[[:space:]])error:|Error:|error detected|Unhandled exception|Exception:|FAILURE:' flutter_app/build-apk.log 2>/dev/null | head -40; } | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error ::$esc"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner
        working-directory: flutter_app
        run: flutter create --platforms=windows --org=com.jathol --project-name=order_flow .

      - name: Patch Windows runner branding and window size
        run: python scripts/patch_windows_runner.py flutter_app

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Windows release
        working-directory: flutter_app
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --no-tree-shake-icons 2>&1 | tee build-windows.log

      - name: Surface build errors (diagnostics)
        if: failure()
        shell: bash
        run: |
          { grep -E '(^|[[:space:]])error:|Error:|error detected|Unhandled exception|Exception:|FAILURE:' flutter_app/build-windows.log 2>/dev/null | head -40; } | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error ::$esc"
          done

      - name: Zip Windows build
        working-directory: flutter_app/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath ../order-flow-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: flutter_app/build/windows/x64/runner/Release/../order-flow-windows.zip
          if-no-files-found: error

  publish-release:
    needs: [build-apk, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-apk
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: app-windows
          path: dist

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/app-release.apk
            dist/order-flow-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
