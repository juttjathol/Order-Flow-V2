name: Build Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install a valid Gradle wrapper
        run: bash scripts/ensure_gradle_wrapper.sh

      - name: Force compileSdk 36 and minSdk 23
        run: python3 scripts/patch_android.py

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Patch Android plugin namespaces
        run: python3 scripts/patch_android.py --plugins

      - name: Analyze (warnings non-fatal)
        working-directory: flutter_app
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        working-directory: flutter_app
        run: flutter test

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
