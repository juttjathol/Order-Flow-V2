name: Verify Release Docs & Version

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (e.g. v1.1.98)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Verify tag, app version, and download fallbacks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" == v* ]]
          VERSION="${TAG#v}"
          python3 scripts/version_sync_check.py flutter_app
          PUB=$(grep -oP '^version:\s*\K[0-9.]+' flutter_app/pubspec.yaml | head -1)
          APP=$(grep -oP "kAppVersion\s*=\s*'\K[0-9.]+" flutter_app/lib/core/constants.dart | head -1)
          for FILE in functions/download.js website/functions/download.js cloudflare_dashboard/functions/download.js; do
            FALLBACK=$(grep -oP 'FALLBACK_TAG\s*=\s*"\K[^"]+' "$FILE" | head -1)
            [[ "$FALLBACK" == "$TAG" ]] || { echo "::error::$FILE uses $FALLBACK, expected $TAG"; exit 1; }
          done
          [[ "$PUB" == "$VERSION" ]] || { echo "::error::pubspec version $PUB does not match $TAG"; exit 1; }
          [[ "$APP" == "$VERSION" ]] || { echo "::error::app version $APP does not match $TAG"; exit 1; }
          echo "Release version $TAG is consistent."
