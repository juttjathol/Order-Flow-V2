name: Device matrix — real-world testing

on:
  push:
    branches: [main, arena/**]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_app
      - name: Run analyze (fatal-infos)
        working-directory: flutter_app
        run: |
          flutter analyze 2>&1 | tee analyze.log
          echo "analyze exit code: ${PIPESTATUS[0]}" >> analyze.log
          # keep --fatal-infos as separate non-blocking check (warnings only)
          flutter analyze --fatal-warnings 2>&1 | tee -a analyze.log || true
      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: flutter_app/analyze.log
          if-no-files-found: warn
      - name: Post analyze log as commit comment on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(tail -n 400 flutter_app/analyze.log 2>/dev/null | head -c 50000 || echo "no log")
          # escape for JSON via gh api -f
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="Device-matrix analyze failure on ${{ github.sha }}:
          \`\`\`
          $LOG
          \`\`\`" || echo "comment failed"
      - name: Run tests with coverage
        working-directory: flutter_app
        run: |
          flutter test --coverage 2>&1 | tee test.log || true
          echo "test exit: ${PIPESTATUS[0]}" >> test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: flutter_app/test.log
          if-no-files-found: warn

  goldens:
    runs-on: ubuntu-latest
    needs: analyze
    strategy:
      matrix:
        device:
          - name: "iPhone SE (375x667)"
            width: 375
            height: 667
            pixelRatio: 2
          - name: "Pixel 5 (393x851)"
            width: 393
            height: 851
            pixelRatio: 2.75
          - name: "iPad Air (820x1180)"
            width: 820
            height: 1180
            pixelRatio: 2
          - name: "Desktop 1280x720"
            width: 1280
            height: 720
            pixelRatio: 1
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_app
      - name: "Golden + layout check: ${{ matrix.device.name }}"
        run: |
          flutter test test/golden_test.dart \
            --dart-define=TEST_WIDTH=${{ matrix.device.width }} \
            --dart-define=TEST_HEIGHT=${{ matrix.device.height }} \
            --dart-define=TEST_PIXEL_RATIO=${{ matrix.device.pixelRatio }}
        working-directory: flutter_app
        continue-on-error: true

  dark-mode:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_app
      - name: "Dark mode contrast check"
        run: flutter test test/theme_contrast_test.dart --dart-define=FORCE_DARK=true
        working-directory: flutter_app
        continue-on-error: true

  slow-3g:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_app
      - name: "Slow 3G — timeouts & skeletons"
        run: |
          flutter test test/slow_network_test.dart \
            --dart-define=SIMULATE_SLOW_3G=true \
            --dart-define=NETWORK_DELAY_MS=3000
        working-directory: flutter_app
        continue-on-error: true

  # Phase-2 note: patrol integration for on-device E2E (requires physical runners)
  # Uncomment when self-hosted runner with Android emulator / iOS simulator is available:
