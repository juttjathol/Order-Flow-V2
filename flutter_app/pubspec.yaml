name: order_flow
description: Offline-first multi-device POS for restaurants, retail, fast food, and services.
publish_to: "none"
version: 1.1.24+24

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: 0.11.2
  collection: ^1.18.0
  connectivity_plus: ">=6.1.0 <7.0.0"
  file_picker: ">=8.1.0 <9.0.0"
  fl_chart: ">=0.69.0 <1.0.0"
  flutter_riverpod: ">=2.6.1 <3.0.0"
  go_router: ">=14.6.0 <15.0.0"
  google_mlkit_barcode_scanning: 0.13.0
  google_mlkit_commons: 0.11.0
  http: ^1.2.2
  image: ^4.3.0
  image_picker: ^1.1.2
  intl: ">=0.19.0 <0.22.0"
  network_info_plus: ">=6.1.0 <7.0.0"
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  share_plus: ">=10.1.0 <11.0.0"
  shared_preferences: ^2.3.4
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/brand/logo.png
    - assets/brand/bolt.png
    - assets/brand/mark.png
    - assets/web/index.html
